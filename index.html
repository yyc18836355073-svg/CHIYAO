<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>幽门螺杆菌四联疗法打卡助手</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HP服药打卡" />
    <meta name="description" content="幽门螺杆菌14天四联疗法专用的科学服药倒计时与打卡PWA工具" />
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('[PWA] ServiceWorker 注册成功:', reg.scope))
            .catch(err => console.error('[PWA] ServiceWorker 注册失败:', err));
        });
      }
    </script>
  </body>
</html>
